name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core tests
        run: npm test
      - name: Validate JSON and dataset
        run: |
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('data/question-bank.json')); const r=JSON.parse(fs.readFileSync('data/roadmap.json')); if(q.length!==50) process.exit(1); if(r.weeks!==24) process.exit(1);"
          node -e "const fs=require('fs'); const lines=fs.readFileSync('datasets/hotel_daily.csv','utf8').trim().split(/\r?\n/); if(lines.length!==1461) { console.error('Expected 1460 data rows, got',lines.length-1); process.exit(1); }"
