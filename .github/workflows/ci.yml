name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Academy quality gates
        run: npm test
      - name: Validate starter diagnostic and dataset
        run: |
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('data/question-bank.json')); const r=JSON.parse(fs.readFileSync('data/roadmap.json')); if(q.length!==50) process.exit(1); if(r.weeks!==24) process.exit(1);"
          node -e "const fs=require('fs'); const lines=fs.readFileSync('datasets/hotel_daily.csv','utf8').trim().split(/\\r?\\n/); if(lines.length!==1461) { console.error('Expected 1460 data rows, got',lines.length-1); process.exit(1); }"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/learning-os-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          npm run test:browser
