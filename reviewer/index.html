<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio İnceleme · Data Analyst Learning OS</title><link rel="stylesheet" href="/auth.css"><style>.review-grid{display:grid;gap:16px}.review-card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:18px}.review-meta{display:flex;gap:10px;flex-wrap:wrap;color:#667085;font-size:13px}.review-rubric{display:grid;gap:10px;margin:14px 0}.review-rubric label{display:grid;gap:5px;font-weight:600}.review-rubric textarea,.decision-comment{width:100%;box-sizing:border-box;min-height:70px;padding:10px;border:1px solid #cfd6df;border-radius:10px}.review-actions{display:flex;gap:10px;flex-wrap:wrap}.review-actions button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.approve{background:#111827;color:white}.changes{background:#fff3f0;color:#9a3412}.empty{color:#667085}</style></head>
<body><main class="admin-shell"><header class="admin-top"><div><small>DATA ANALYST LEARNING OS</small><h1>Portfolio İnceleme</h1></div><div><a class="auth-secondary" href="/">Çalışma alanı</a> <button class="auth-secondary" data-logout type="button">Çıkış</button></div></header><div class="auth-alert error" data-alert hidden></div><section class="admin-panel"><h2>Bekleyen projeler</h2><p>Onay yalnızca gerçek reviewer kararıyla verilir. Otomatik kanıtlar insan değerlendirmesinin yerine geçmez.</p><div class="review-grid" data-queue><p class="empty">Yükleniyor…</p></div></section></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import {REVIEW_RUBRIC_IDS,validateReviewDecision} from "/reviewer-workflow.mjs";
const supabase=createClient("https://mudlekwkoxbkkauxberv.supabase.co","sb_publishable_gwyoygp8B-OBdXrLXbc6ZA_MGk9rvWx",{auth:{persistSession:true,autoRefreshToken:true}});
const queue=document.querySelector('[data-queue]'),alertBox=document.querySelector('[data-alert]');
function show(message,type='error'){alertBox.hidden=false;alertBox.className='auth-alert '+type;alertBox.textContent=message}
const {data:{session}}=await supabase.auth.getSession();if(!session)location.replace('/giris?returnTo=%2Freviewer');
const {data:me}=await supabase.from('profiles').select('active,role').eq('id',session.user.id).maybeSingle();if(!me?.active||!['admin','reviewer'].includes(me.role))location.replace('/giris?hata='+encodeURIComponent('Reviewer yetkisi gerekli.'));
const labels={sql:'SQL doğruluğu',kpi:'KPI tasarımı',chart:'Görselleştirme doğruluğu',interpretation:'Analitik yorum','executive-communication':'Yönetici iletişimi'};
async function load(){const {data,error}=await supabase.from('portfolio_reviews').select('id,learner_id,project_id,evidence,status,submitted_at,version').eq('status','review_pending').order('submitted_at',{ascending:true});if(error){show('İnceleme kuyruğu yüklenemedi.');return}queue.replaceChildren();if(!(data||[]).length){queue.innerHTML='<p class="empty">Bekleyen proje yok.</p>';return}for(const review of data){const card=document.createElement('article');card.className='review-card';card.dataset.reviewId=review.id;const evidence=review.evidence||{};card.innerHTML='<h3></h3><div class="review-meta"></div><details><summary>Gönderilen kanıtı görüntüle</summary><pre></pre></details><div class="review-rubric"></div><label>Genel karar notu<textarea class="decision-comment" placeholder="Özellikle revizyon isteniyorsa neyin değişmesi gerektiğini yaz."></textarea></label><div class="review-actions"><button class="approve" type="button">Onayla</button><button class="changes" type="button">Revizyon iste</button></div>';card.querySelector('h3').textContent=review.project_id;card.querySelector('.review-meta').textContent=`Öğrenci: ${review.learner_id} · Sürüm ${review.version} · ${new Date(review.submitted_at).toLocaleString('tr-TR')}`;card.querySelector('pre').textContent=JSON.stringify(evidence,null,2);const rubric=card.querySelector('.review-rubric');for(const id of REVIEW_RUBRIC_IDS){const label=document.createElement('label');label.textContent=labels[id];const area=document.createElement('textarea');area.dataset.rubric=id;area.placeholder='İsteğe bağlı reviewer notu';label.append(area);rubric.append(label)}async function decide(decision){const comments=Object.fromEntries([...card.querySelectorAll('[data-rubric]')].map(el=>[el.dataset.rubric,el.value]));const checked=validateReviewDecision({decision,rubricComments:comments,comment:card.querySelector('.decision-comment').value});if(!checked.ok){show('Revizyon kararında en az bir açıklama gerekli.');return}for(const b of card.querySelectorAll('button'))b.disabled=true;const {error}=await supabase.rpc('decide_portfolio_review',{p_review_id:review.id,p_decision:checked.decision,p_rubric_comments:checked.rubricComments,p_comment:checked.comment||null});if(error){show(error.message||'Karar kaydedilemedi.');for(const b of card.querySelectorAll('button'))b.disabled=false;return}show(decision==='approved'?'Proje onaylandı.':'Revizyon talebi kaydedildi.','success');await load()}card.querySelector('.approve').addEventListener('click',()=>decide('approved'));card.querySelector('.changes').addEventListener('click',()=>decide('changes_requested'));queue.append(card)}}
document.querySelector('[data-logout]').addEventListener('click',async()=>{await supabase.auth.signOut();location.replace('/giris')});await load();
</script></body></html>
